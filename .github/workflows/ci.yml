name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        # Both ends of the peerDependencies range (>=0.6.0 <1).
        sdk: ["0.6.0", "<1"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save "@typesafe-ai/sdk@${{ matrix.sdk }}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        if: ${{ !(matrix.node == 24 && matrix.sdk == '<1') }}
      - name: Test with coverage
        if: ${{ matrix.node == 24 && matrix.sdk == '<1' }}
        run: npm run coverage
      - run: npm run build
      - name: Verify publishable contents
        run: npm pack --dry-run
